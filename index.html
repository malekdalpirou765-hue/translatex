<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>TranslateX AI</title>

<style>
body{
  margin:0;
  font-family: Arial;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background: linear-gradient(120deg,#4facfe,#00f2fe);
}

.box{
  width:500px;
  background:white;
  padding:20px;
  border-radius:15px;
}

textarea,select,button{
  width:100%;
  padding:10px;
  margin-top:10px;
}

button{
  background:#4facfe;
  color:white;
  border:none;
}

#result{
  margin-top:10px;
  font-size:18px;
  color:green;
}
</style>
</head>

<body>

<div class="box">

<h2>🌍 AI Translator</h2>

<textarea id="text" placeholder="Write text..."></textarea>

<!-- FROM -->
<select id="fromLang">
  <option>Auto Detect</option>
  <option>English</option>
  <option>Arabic</option>
  <option>French</option>
  <option>Spanish</option>
  <option>German</option>
  <option>Italian</option>
  <option>Portuguese</option>
  <option>Turkish</option>
  <option>Russian</option>
  <option>Chinese</option>
  <option>Japanese</option>
  <option>Korean</option>
  <option>Hindi</option>
  <option>Urdu</option>
  <option>Greek</option>
  <option>Hebrew</option>
  <option>Persian</option>
  <option>Swedish</option>
  <option>Norwegian</option>
</select>

<!-- TO -->
<select id="toLang">
  <option>English</option>
  <option>Arabic</option>
  <option>French</option>
  <option>Spanish</option>
  <option>German</option>
  <option>Italian</option>
  <option>Portuguese</option>
  <option>Turkish</option>
  <option>Russian</option>
  <option>Chinese</option>
  <option>Japanese</option>
  <option>Korean</option>
  <option>Hindi</option>
  <option>Urdu</option>
  <option>Greek</option>
  <option>Hebrew</option>
  <option>Persian</option>
  <option>Swedish</option>
  <option>Norwegian</option>
</select>

<button onclick="translate()">Translate 🚀</button>

<div id="result"></div>

</div>

<script>

async function translate(){

  let text = document.getElementById("text").value;
  let from = document.getElementById("fromLang").value;
  let to = document.getElementById("toLang").value;

  document.getElementById("result").innerText = "Translating... 🤖";

  let res = await fetch("/translate", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ text, from, to })
  });

  let data = await res.json();

  document.getElementById("result").innerText = data.result;
}

</script>

</body>
</html>
