<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>TranslateX AI</title>

<style>
body{
  margin:0;
  font-family: Arial;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background: linear-gradient(120deg,#4facfe,#00f2fe);
}

.box{
  width:500px;
  background:white;
  padding:20px;
  border-radius:15px;
  box-shadow:0 10px 20px rgba(0,0,0,0.2);
}

textarea,select,button{
  width:100%;
  padding:10px;
  margin-top:10px;
}

button{
  background:#1976d2;
  color:white;
  border:none;
  cursor:pointer;
}

button:hover{
  background:#125aa3;
}

#result{
  margin-top:15px;
  padding:10px;
  background:#f5f5f5;
  border-radius:10px;
  min-height:40px;
}
</style>

</head>

<body>

<div class="box">

<h2>TranslateX AI</h2>

<textarea id="text" placeholder="Write text..."></textarea>

<select id="from">
  <option>Auto</option>
  <option>English</option>
  <option>Arabic</option>
  <option>French</option>
  <option>Spanish</option>
  <option>German</option>
</select>

<select id="to">
  <option>Arabic</option>
  <option>English</option>
  <option>French</option>
  <option>Spanish</option>
  <option>German</option>
</select>

<button onclick="translateText()">AI Translate</button>

<button onclick="speak()">Speak</button>

<div id="result">Result will appear here...</div>

</div>

<script>

// 🤖 إرسال طلب للسيرفر
async function translateText(){

  let text = document.getElementById("text").value;
  let from = document.getElementById("from").value;
  let to = document.getElementById("to").value;

  document.getElementById("result").innerText = "Translating...";

  try{

    let res = await fetch("/translate", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        text: text,
        from: from,
        to: to
      })
    });

    let data = await res.json();

    document.getElementById("result").innerText = data.result;

  }catch(err){
    document.getElementById("result").innerText = "Error connecting to server";
  }
}

// 🔊 صوت النتيجة
function speak(){

  let text = document.getElementById("result").innerText;

  if(!text || text === "Result will appear here...") return;

  let speech = new SpeechSynthesisUtterance(text);
  speech.rate = 1;

  speechSynthesis.speak(speech);
}

</script>

</body>
</html>
