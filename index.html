<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TranslateX Pro</title>

<style>

body{
  margin:0;
  font-family:Arial;
  background: linear-gradient(135deg,#4facfe,#ffffff);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.container{
  width:520px;
  background:white;
  padding:25px;
  border-radius:15px;
  box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

/* 🔥 Top buttons */
.topbar{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-bottom:15px;
}

.topbar button{
  flex:1;
  padding:10px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  background:#4facfe;
  color:white;
}

.topbar button:hover{
  background:#007bff;
}

h1{
  text-align:center;
}

textarea{
  width:100%;
  height:140px;
  padding:10px;
  font-size:16px;
  border-radius:10px;
  border:1px solid #ccc;
  resize:none;
}

select{
  width:100%;
  padding:10px;
  margin-top:8px;
  border-radius:10px;
}

#result{
  margin-top:15px;
  font-size:18px;
  min-height:40px;
  color:green;
}

</style>

</head>

<body>

<div class="container">

<h1>🌍 TranslateX Pro</h1>

<!-- 🔥 Top buttons -->
<div class="topbar">
  <button onclick="translateText()">Translate</button>
  <button onclick="speakText()">🔊 Speak</button>
</div>

<textarea id="text" placeholder="Type here..."></textarea>

<select id="fromLang">
<option value="en">English</option>
<option value="ar">Arabic</option>
<option value="fr">French</option>
<option value="es">Spanish</option>
<option value="de">German</option>
<option value="it">Italian</option>
<option value="pt">Portuguese</option>
<option value="ru">Russian</option>
<option value="tr">Turkish</option>
<option value="nl">Dutch</option>
<option value="pl">Polish</option>
<option value="sv">Swedish</option>
<option value="da">Danish</option>
<option value="fi">Finnish</option>
<option value="no">Norwegian</option>
<option value="cs">Czech</option>
<option value="hu">Hungarian</option>
<option value="ro">Romanian</option>
<option value="bg">Bulgarian</option>
<option value="el">Greek</option>
<option value="uk">Ukrainian</option>
<option value="hi">Hindi</option>
<option value="ur">Urdu</option>
<option value="bn">Bengali</option>
<option value="ta">Tamil</option>
<option value="te">Telugu</option>
<option value="ml">Malayalam</option>
<option value="zh">Chinese</option>
<option value="ja">Japanese</option>
<option value="ko">Korean</option>
<option value="th">Thai</option>
<option value="vi">Vietnamese</option>
<option value="id">Indonesian</option>
<option value="fa">Persian</option>
<option value="he">Hebrew</option>
</select>

<select id="toLang">
<option value="ar">Arabic</option>
<option value="en">English</option>
<option value="fr">French</option>
<option value="es">Spanish</option>
<option value="de">German</option>
<option value="it">Italian</option>
<option value="pt">Portuguese</option>
<option value="ru">Russian</option>
<option value="tr">Turkish</option>
<option value="nl">Dutch</option>
<option value="pl">Polish</option>
<option value="sv">Swedish</option>
<option value="da">Danish</option>
<option value="fi">Finnish</option>
<option value="no">Norwegian</option>
<option value="cs">Czech</option>
<option value="hu">Hungarian</option>
<option value="ro">Romanian</option>
<option value="bg">Bulgarian</option>
<option value="el">Greek</option>
<option value="uk">Ukrainian</option>
<option value="hi">Hindi</option>
<option value="ur">Urdu</option>
<option value="bn">Bengali</option>
<option value="ta">Tamil</option>
<option value="te">Telugu</option>
<option value="ml">Malayalam</option>
<option value="zh">Chinese</option>
<option value="ja">Japanese</option>
<option value="ko">Korean</option>
<option value="th">Thai</option>
<option value="vi">Vietnamese</option>
<option value="id">Indonesian</option>
<option value="fa">Persian</option>
<option value="he">Hebrew</option>
</select>

<p id="result"></p>

</div>

<script>

let lastTranslatedText = "";

async function translateText(){

  let text = document.getElementById("text").value;
  let from = document.getElementById("fromLang").value;
  let to = document.getElementById("toLang").value;

  if(!text){
    document.getElementById("result").innerText = "";
    return;
  }

  let url =
  `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${from}|${to}`;

  try{

    let response = await fetch(url);
    let data = await response.json();

    lastTranslatedText = data.responseData.translatedText;

    document.getElementById("result").innerText =
    lastTranslatedText;

  }catch(e){
    document.getElementById("result").innerText =
    "Translation error";
  }
}

function speakText(){

  if(!lastTranslatedText) return;

  window.speechSynthesis.cancel();

  let speech =
  new SpeechSynthesisUtterance(lastTranslatedText);

  speech.rate = 1;
  speech.pitch = 1;
  speech.lang = "en-US";

  window.speechSynthesis.speak(speech);
}

</script>

</body>
</html>
