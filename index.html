<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>TranslateX AI</title>

<style>
body{
  margin:0;
  font-family: Arial;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background: linear-gradient(135deg,#4facfe,#00f2fe,#a6ffcb);
}

.box{
  width:540px;
  background:white;
  padding:22px;
  border-radius:16px;
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

h2{
  text-align:center;
  margin-bottom:10px;
}

textarea{
  width:100%;
  height:120px;
  padding:10px;
  border-radius:10px;
  border:1px solid #ccc;
}

select{
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:10px;
}

button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  background:#1e88e5;
  color:white;
  font-size:15px;
  cursor:pointer;
}

button:hover{
  background:#1565c0;
}

#result{
  margin-top:12px;
  padding:12px;
  background:#f5f7fa;
  border-radius:10px;
  min-height:50px;
  font-size:16px;
}
</style>

</head>

<body>

<div class="box">

<h2>TranslateX AI</h2>

<textarea id="text" placeholder="Write your text here..."></textarea>

<select id="fromLang">
  <option>Auto Detect</option>
  <option>English</option>
  <option>Arabic</option>
  <option>French</option>
  <option>Spanish</option>
  <option>German</option>
  <option>Italian</option>
  <option>Portuguese</option>
  <option>Turkish</option>
  <option>Russian</option>
  <option>Chinese</option>
  <option>Japanese</option>
  <option>Korean</option>
  <option>Hindi</option>
  <option>Urdu</option>
  <option>Greek</option>
  <option>Persian</option>
  <option>Hebrew</option>
  <option>Swedish</option>
  <option>Norwegian</option>
  <option>Dutch</option>
</select>

<select id="toLang">
  <option>Arabic</option>
  <option>English</option>
  <option>French</option>
  <option>Spanish</option>
  <option>German</option>
  <option>Italian</option>
  <option>Portuguese</option>
  <option>Turkish</option>
  <option>Russian</option>
  <option>Chinese</option>
  <option>Japanese</option>
  <option>Korean</option>
  <option>Hindi</option>
  <option>Urdu</option>
  <option>Greek</option>
  <option>Persian</option>
  <option>Hebrew</option>
  <option>Swedish</option>
  <option>Norwegian</option>
  <option>Dutch</option>
</select>

<button onclick="translateAI()">AI Translate</button>
<button onclick="speak()">Play Audio</button>

<div id="result">Result will appear here...</div>

</div>

<script>

// 🤖 AI TRANSLATION
async function translateAI(){

  let text = document.getElementById("text").value;
  let from = document.getElementById("fromLang").value;
  let to = document.getElementById("toLang").value;

  document.getElementById("result").innerText = "Translating...";

  let res = await fetch("/translate", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ text, from, to })
  });

  let data = await res.json();

  document.getElementById("result").innerText = data.result;
}

// 🔊 SPEECH
function speak(){
  let text = document.getElementById("result").innerText;

  if(!text || text === "Result will appear here...") return;

  let speech = new SpeechSynthesisUtterance(text);
  speech.rate = 1;
  speech.pitch = 1;

  speechSynthesis.speak(speech);
}

</script>

</body>
</html>
