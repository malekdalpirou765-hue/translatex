<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TranslateX</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      margin-top: 50px;
    }
    input, select {
      width: 300px;
      padding: 10px;
      margin: 5px;
    }
    button {
      padding: 10px 20px;
      cursor: pointer;
      margin-top: 10px;
    }
    #result {
      margin-top: 20px;
      font-size: 20px;
      color: green;
    }
  </style>
</head>
<body>

  <h1>translatex</h1>

  <input id="text" placeholder="Type text here">

  <br>

  <select id="fromLang">
    <option value="en">English</option>
    <option value="fr">French</option>
    <option value="es">Spanish</option>
    <option value="de">German</option>
    <option. value="ar">Arabic</option>
    <option. value="ar">Japanese</option>
    <option. value="ar">Chinese </option>
    </select>

  <select id="toLang">
    <option value="ar">Arabic</option>
    <option value="en">English</option>
    <option value="fr">French</option>
    <option value="es">Spanish</option>
    <option value="de">German</option>
   <option. value="ar">Japanese</option>
    <option. value="ar">Chinese </option>
   </select>
  

  

  <br>

  <button onclick="translateText()">Translate</button>
  <button onclick="speakText()">🔊 Speak</button>

  <p id="result"></p>

  <script>
    let lastTranslatedText = "";

    async function translateText() {
      let text = document.getElementById("text").value;
      let from = document.getElementById("fromLang").value;
      let to = document.getElementById("toLang").value;

      if (!text) {
        document.getElementById("result").innerText = "Please type something";
        return;
      }

      let url = `https://api.mymemory.translated.net/get?q=${text}&langpair=${from}|${to}`;

      let response = await fetch(url);
      let data = await response.json();

      lastTranslatedText = data.responseData.translatedText;

      document.getElementById("result").innerText = lastTranslatedText;
    }

    function speakText() {
      if (!lastTranslatedText) return;

      let speech = new SpeechSynthesisUtterance();
      speech.text = lastTranslatedText;
      speech.lang = "en-US"; // يمكن تغييره لاحقاً حسب اللغة

      window.speechSynthesis.speak(speech);
    }
  </script>
